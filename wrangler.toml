# Cloudflare Pages (free plan): static app from dist/ + Pages Functions (functions/) + D1.
# Setup steps: docs/06-deployment.md §8
name = "ma-compass"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-30"

# ACCESS_TEAM_DOMAIN / ACCESS_AUD / ADMIN_EMAILS は公開リポジトリに書かず、Pages のシークレットとして登録する
# （scripts/cf-setup.mjs が自動登録。手動の場合: npx wrangler pages secret put ACCESS_AUD --project-name ma-compass）

[[d1_databases]]
binding = "DB"
database_name = "ma-compass"
database_id = "<wrangler d1 create ma-compass で表示される ID>"
migrations_dir = "migrations"
